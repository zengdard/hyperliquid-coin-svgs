name: Update SVGs

"on":
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      publish_unpublished:
        description: "Also publish when the current version is not on npm"
        type: boolean
        default: false

concurrency:
  group: update-svgs
  cancel-in-progress: false

jobs:
  # Fetch, verify and push the refreshed SVGs. This job never needs publish
  # rights, so it always runs to completion even if npm is misconfigured.
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - run: npm run fetch:live

      - name: Check for changes
        id: diff
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run build
          npm test

      - name: Commit and push SVG updates
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: update SVGs [skip ci]"
          git push origin main

  # Publish in its own job: npm Trusted Publishing is bound to the environment
  # name, and the manual approval must not gate the 13-minute fetch above.
  publish:
    needs: update
    if: always() && needs.update.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/hyperliquid-coin-svgs
    permissions:
      contents: write
      # Required by npm Trusted Publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Deliberately NO registry-url: setup-node would write an .npmrc that
      # references NODE_AUTH_TOKEN, and npm prefers that token over OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Trusted Publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      # Publish when the SVGs changed, or on demand when the current version has
      # never been published (e.g. a release staged earlier and still pending).
      - name: Decide whether to publish
        id: gate
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          if [ "${{ needs.update.outputs.changed }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.publish_unpublished }}" = "true" ] && \
               ! npm view "hyperliquid-coin-svgs@$LOCAL" version >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $LOCAL is not on npm yet — publishing it."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No SVG changes and $LOCAL already published or pending — nothing to do."
          fi

      - name: Bump version
        if: steps.gate.outputs.publish == 'true'
        run: |
          npm version patch --no-git-tag-version
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # npm Trusted Publishing created after 2026-09-03 allows `npm stage
      # publish` by default; direct `npm publish` must be explicitly enabled on
      # npmjs.com. Staging does not require 2FA — a maintainer approves later.
      # Set the repository variable NPM_PUBLISH_MODE=direct once direct
      # publishing is allowed.
      - name: Publish to npm
        id: publish
        if: steps.gate.outputs.publish == 'true'
        continue-on-error: true
        env:
          NPM_KEY: ${{ secrets.NPM_KEY }}
          NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE || 'stage' }}
        run: |
          AUTH_FILE="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -n "${NPM_KEY:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_KEY" > "$AUTH_FILE"
            if npm whoami >/dev/null 2>&1; then
              echo "Publishing with NPM_KEY"
              if [ "$NPM_PUBLISH_MODE" = "direct" ]; then npm publish; else npm stage publish; fi
              exit 0
            fi
            echo "::warning::NPM_KEY is invalid — falling back to OIDC."
          fi
          # OIDC requires that no token is configured anywhere.
          printf 'registry=https://registry.npmjs.org/\n' > "$AUTH_FILE"
          if [ "$NPM_PUBLISH_MODE" = "direct" ]; then
            echo "Direct publish via OIDC"
            npm publish --provenance
          else
            echo "Staged publish via OIDC (approval required on npmjs.com)"
            npm stage publish --provenance
          fi

      - name: Commit version and tag
        if: steps.publish.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump to v$VERSION [skip ci]"
          fi
          git tag "v$VERSION"
          git push origin main
          git push origin "v$VERSION"

      - name: Explain how to finish a staged release
        if: steps.publish.outcome == 'success' && vars.NPM_PUBLISH_MODE != 'direct'
        run: |
          echo "::notice title=Release staged::v$VERSION was staged. Approve it with 2FA on npmjs.com (Staged Packages) or run: npm stage list hyperliquid-coin-svgs && npm stage approve <stage-id>"
          {
            echo "### Release v$VERSION staged"
            echo ""
            echo "It is not installable yet. A maintainer must approve it with 2FA:"
            echo "1. npmjs.com → Staged Packages → **Approve**, or"
            echo "2. \`npm stage list hyperliquid-coin-svgs\` then \`npm stage approve <stage-id>\`"
            echo ""
            echo "To publish without this step, enable **Allow npm publish** on the"
            echo "Trusted Publisher and set the repository variable \`NPM_PUBLISH_MODE=direct\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn when publishing is unavailable
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning title=npm publish skipped::npm refused the publication. Check the Trusted Publisher config (repo zengdard/hyperliquid-coin-svgs, workflow update-svgs.yml, environment npm-publish)."
          {
            echo "### npm publish skipped"
            echo ""
            echo "Check the Trusted Publisher entry on npmjs.com:"
            echo "- Repository: \`zengdard/hyperliquid-coin-svgs\`"
            echo "- Workflow: \`update-svgs.yml\`"
            echo "- Environment: \`npm-publish\`"
          } >> "$GITHUB_STEP_SUMMARY"
