name: Update SVGs

"on":
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  # Required by npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
  id-token: write

concurrency:
  group: update-svgs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run fetch:live

      - name: Check for changes
        id: diff
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run build
          npm test

      # Commit the refreshed SVGs first: the repository must stay in sync even
      # when publishing is not possible.
      - name: Commit SVG updates
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: update SVGs [skip ci]"

      # Decide how (or whether) we can publish:
      #   1. NPM_KEY token, if set and valid;
      #   2. otherwise npm Trusted Publishing via OIDC;
      #   3. otherwise skip publishing but still push the SVG updates.
      - name: Check publish credentials
        id: auth
        if: steps.diff.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ] && npm whoami >/dev/null 2>&1; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          elif [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No valid npm credentials. Configure Trusted Publishing for this workflow on npmjs.com, or set a valid NPM_KEY secret. Skipping publish."
          fi

      - name: Bump version
        if: steps.auth.outputs.mode != 'none' && steps.auth.outputs.mode != ''
        run: |
          npm version patch --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump to v$(node -p "require('./package.json').version") [skip ci]"

      - name: Publish
        if: steps.auth.outputs.mode != 'none' && steps.auth.outputs.mode != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
        run: |
          if [ "${{ steps.auth.outputs.mode }}" = "oidc" ]; then
            npm publish --provenance
          else
            npm publish
          fi

      - name: Tag and push
        if: steps.auth.outputs.mode != 'none' && steps.auth.outputs.mode != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v$VERSION"
          git push origin main
          git push origin "v$VERSION"

      # Publishing unavailable: still push the SVG refresh so the repo stays
      # current (previously this left the repo ahead with orphan tags).
      - name: Push SVG updates without publishing
        if: steps.diff.outputs.changed == 'true' && (steps.auth.outputs.mode == 'none' || steps.auth.outputs.mode == '')
        run: git push origin main
