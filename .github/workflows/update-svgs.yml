name: Update SVGs

"on":
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  # Required by npm Trusted Publishing (OIDC).
  id-token: write

concurrency:
  group: update-svgs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run fetch:live

      - name: Check for changes
        id: diff
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run build
          npm test

      - name: Commit SVG updates
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: update SVGs [skip ci]"

      # Push the refreshed SVGs before publishing. Publishing depends on
      # credentials we do not control, and it must not prevent the repo from
      # staying up to date (that is what created the orphan v1.0.x tags before).
      - name: Push SVG updates
        if: steps.diff.outputs.changed == 'true'
        run: git push origin main

      - name: Bump version
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm version patch --no-git-tag-version
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Publish to npm
        id: publish
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
        run: |
          # A valid NPM_KEY wins; otherwise fall back to OIDC trusted publishing.
          if [ -n "$NODE_AUTH_TOKEN" ] && npm whoami >/dev/null 2>&1; then
            npm publish
          else
            npm publish --provenance
          fi

      - name: Commit version and tag
        if: steps.publish.outcome == 'success'
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump to v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin main
          git push origin "v$VERSION"

      - name: Warn when publishing is unavailable
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning title=npm publish skipped::The package was updated and pushed, but npm refused the publication (404/401). Configure npm Trusted Publishing for this repository/workflow on npmjs.com, or replace the NPM_KEY secret with a token from an account that maintains hyperliquid-coin-svgs."
          {
            echo "### npm publish skipped"
            echo ""
            echo "The SVG update was committed and pushed, but publishing failed."
            echo "Fix: add this repo as a Trusted Publisher on npmjs.com, or set a valid \`NPM_KEY\` secret."
          } >> "$GITHUB_STEP_SUMMARY"
